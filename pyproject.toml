[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidy3a"
dynamic = ["version"]
description = "Tidy-style verbs for named multidimensional arrays, built on xarray"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rigoberto Leyva Salmeron" }]
keywords = ["xarray", "arrays", "tidyverse", "dplyr", "point-cloud", "raster"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
# NumPy 2's promotion rules (x * 2 on float32 stays float32) are assumed by
# the write-back rules in docs/plan.md §5.4. NumPy is the only requirement:
# eager, in-memory pipelines run on the NumPy backend without xarray.
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
# The xarray backend: xarray inputs and outputs (tidy(), collect()), and lazy,
# chunked, and memory-mapped data. 2.2.2 is the first pandas built for NumPy 2;
# older wheels fail to import alongside numpy>=2.0.
xarray = ["xarray>=2024.6", "pandas>=2.2.2"]
# Compiled grouped float32 sums and means (tidy3a.labelarray.sums); the same results as without it, faster.
# 0.60 is the first Numba release for NumPy 2.0. Numba supports a new NumPy some months after it appears.
fast = ["numba>=0.60"]
# opt_einsum: xarray uses it for dot when installed; the tests check tidy3a's results do not change.
# numba: the tests run the compiled path; the minimum-dependency job runs the NumPy path.
dev = ["xarray>=2024.6", "pandas>=2.2.2", "numba>=0.60", "pytest>=7.0", "flox>=0.9", "ipython>=8.0", "dask[array]",
       "opt_einsum"]

[project.urls]
Homepage = "https://github.com/rleyvasal/tidy3a"

[tool.setuptools.dynamic]
version = { attr = "tidy3a.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tidy3a = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "prototypes"]
pythonpath = ["src"]
filterwarnings = [
  # flox imports a NumPy NaT dtype with a deprecated generic unit.
  "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
